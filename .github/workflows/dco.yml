name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Runs on pull_request (not pull_request_target): tim-actions/get-pr-commits only
# accepts pull_request and merge_group events. Fork PRs get a read-only token, and
# the job never checks out or executes pull-request code; it only reads commit
# metadata through the GitHub API.
#
# Known limits:
# - get-pr-commits lists commits without pagination, so only the first 30 commits
#   of a pull request are checked.
# - Both tim-actions actions declare end-of-life Node runtimes (node16 and node12)
#   and may stop working when GitHub removes those runtimes. If this check starts
#   failing at the runtime level, replace them first.
jobs:
  dco-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Get PR commits
        id: get-pr-commits
        uses: tim-actions/get-pr-commits@198af03565609bb4ed924d1260247b4881f09e7d # v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check DCO sign-off
        uses: tim-actions/dco@f2279e6e62d5a7d9115b0cb8e837b777b1b02e21 # v1.1.0
        with:
          commits: ${{ steps.get-pr-commits.outputs.commits }}
